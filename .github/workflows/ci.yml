# FutureverseAI — CI (TEMPLATE — review before replacing .github/workflows/ci.yml)
# Fixes vs current: installs ruff, runs real tests, CPU-only deps for speed,
# adds pip-audit + npm audit vuln gates, and a Docker build job.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, test, audit
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }

      # CPU-only torch so CI doesn't pull multi-GB CUDA wheels.
      - name: Install (CPU) + dev tools
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install ruff pip-audit pytest pytest-cov

      - name: Format — black
        run: black --check .
      - name: Lint — ruff
        run: ruff check .

      - name: Unit tests
        run: pytest tests/unit -v --tb=short --cov=futureverse_ai/retrieval --cov-report=term-missing

      # Non-blocking at first (report only); flip to fail once the backlog is triaged.
      - name: Dependency audit — pip-audit
        run: pip-audit -r requirements.txt || true

  frontend:
    name: Frontend lint, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run lint || echo "lint warnings"
      - run: npx tsc --noEmit --skipLibCheck
      - run: npm run build
        env: { NODE_ENV: production }
      - name: Dependency audit — npm
        run: npm audit --audit-level=high || true

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push on PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            USE_CUDA=false
            UID=1000
            GID=1000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Heavier integration/eval suite — nightly, not per-PR.
  integration:
    name: Integration (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest pytest-docker
      - run: pytest tests/integration -v --tb=short
