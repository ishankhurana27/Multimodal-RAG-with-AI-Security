name: Bug Report
description: Something is broken
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auth / Login
        - Chat / Messaging
        - Knowledge / RAG
        - Knowledge Graph (Neo4j)
        - Vector Search (Qdrant/Weaviate)
        - Models / LLM
        - Admin Panel
        - API
        - Frontend / UI
        - Docker / Deployment
        - Database / Migrations
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Python 3.11, OS: Ubuntu 22.04, branch: develop"
