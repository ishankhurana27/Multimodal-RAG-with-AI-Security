# FutureverseAI RAG Pipeline — production compose (TEMPLATE — review before use)
# Replaces the stale upstream docker-compose.yaml. Describes the REAL stack:
#   backend (built from this repo) + Weaviate + Neo4j + MySQL + Redis + Ollama
#
# Usage:
#   1. Copy to repo root as docker-compose.prod.yaml
#   2. Create the secret files referenced under `secrets:` (see bottom)
#   3. docker compose -f docker-compose.prod.yaml up -d --build
#
# NOTE: values in ${...} come from your .env. GPU blocks assume NVIDIA + nvidia-container-toolkit.

name: futureverseai

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USE_CUDA: "true"
        USE_CUDA_VER: cu128
        USE_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
        UID: "1000"
        GID: "1000"
    image: futureverseai/backend:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      weaviate:   { condition: service_healthy }
      neo4j:      { condition: service_healthy }
      mysql:      { condition: service_healthy }
      redis:      { condition: service_healthy }
      ollama:     { condition: service_started }
    environment:
      ENV: prod
      PORT: "8080"
      # --- data stores ---
      VECTOR_DB: weaviate
      WEAVIATE_HTTP_HOST: weaviate
      WEAVIATE_HTTP_PORT: "8080"
      WEAVIATE_GRPC_HOST: weaviate
      WEAVIATE_GRPC_PORT: "50051"
      DATABASE_URL: mysql+pymysql://futureverseai:${MYSQL_PASSWORD}@mysql:3306/futureverseai
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_DATABASE: neo4j
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      # --- RAG feature flags (Phase 3: these are OFF by default in code!) ---
      ENABLE_NEO4J: "true"
      ENABLE_RAG_HYBRID_SEARCH: "true"
      RAG_RERANKING_MODEL: ${RAG_RERANKING_MODEL:-BAAI/bge-reranker-v2-m3}
      RAG_EMBEDDING_ENGINE: ${RAG_EMBEDDING_ENGINE:-}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      # --- secrets injected from files, not inline ---
      WEBUI_SECRET_KEY_FILE: /run/secrets/webui_secret_key
      NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
      WEAVIATE_API_KEY_FILE: /run/secrets/weaviate_api_key
    secrets: [webui_secret_key, neo4j_password, weaviate_api_key]
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_data:/app/backend/data
      - model_cache:/app/backend/data/cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s   # allow model load
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0   # match weaviate-client major
    restart: unless-stopped
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none           # vectors supplied by the backend
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY}
      AUTHENTICATION_APIKEY_USERS: rag@futureverse.ai
      QUERY_DEFAULTS_LIMIT: "25"
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/.well-known/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26   # match the neo4j==5.28.* driver line (Phase 2)
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: futureverseai
      MYSQL_USER: futureverseai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }

volumes:
  backend_data: {}
  model_cache: {}
  weaviate_data: {}
  neo4j_data: {}
  mysql_data: {}
  redis_data: {}
  ollama_data: {}

# Create these files locally (gitignored), e.g.:
#   openssl rand -hex 32 > secrets/webui_secret_key
#   printf '%s' 'your-neo4j-pass'   > secrets/neo4j_password
#   printf '%s' 'your-weaviate-key' > secrets/weaviate_api_key
secrets:
  webui_secret_key:  { file: ./secrets/webui_secret_key }
  neo4j_password:    { file: ./secrets/neo4j_password }
  weaviate_api_key:  { file: ./secrets/weaviate_api_key }
